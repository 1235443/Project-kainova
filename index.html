<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KAINOVA AI</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #080d18;
      color: white;
      text-align: center;
      padding: 30px 15px;
    }
    .card {
      max-width: 420px;
      margin: 50px auto;
      padding: 25px;
      border: 1px solid #00d9ff;
      border-radius: 20px;
      background: #111b2d;
      box-shadow: 0 0 20px #003b55;
    }
    h1 { color: #00d9ff; }
    button {
      background: #00d9ff;
      color: #08111f;
      border: none;
      border-radius: 10px;
      padding: 12px 20px;
      margin: 8px;
      font-size: 16px;
      font-weight: bold;
    }
    #status { color: #9eefff; }
  </style>
</head>
<body>
  <div class="card">
    <h1>KAINOVA</h1>
    <p>Your Personal AI Assistant</p>
    <p id="status">System Ready</p>
    <button onclick="speak()">🔊 Voice Test</button>
    <button onclick="listen()">🎤 Voice Command</button>
  </div>  <script>
    function speak() {
      if (!("speechSynthesis" in window)) {
        document.getElementById("status").textContent =
          "Voice output is not supported in this browser.";
        return;
      }
      const msg = new SpeechSynthesisUtterance(
        "Hello Supravat. KAINOVA system is ready."
      );
      msg.lang = "en-IN";
      speechSynthesis.speak(msg);
      document.getElementById("status").textContent = "Speaking...";
    }

    function listen() {
      const Recognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

      if (!Recognition) {
        document.getElementById("status").textContent =
          "Voice recognition is not supported here.";
        return;
      }

      const recognition = new Recognition();
      recognition.lang = "en-IN";
      recognition.onresult = function(event) {
        const command = event.results[0][0].transcript;
        document.getElementById("status").textContent =
          "You said: " + command;
      };
      recognition.onerror = function() {
        document.getElementById("status").textContent =
          "Microphone error. Please try again.";
      };
      recognition.start();
    }
  </script></body>
</html>
